<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交易所系统讲解幻灯片</title>
<style>
  :root { --bg: #0d0e10; --panel: #16181c; --line: #2c3038; --text: #eceae4; --text-2: #9ea3ad; --gold: #f0b90b; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif; }
  .page { max-width: 1240px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-family: "Songti SC", serif; font-size: 30px; margin: 0 0 6px; }
  .lead { color: var(--text-2); margin: 0 0 24px; max-width: 760px; }
  .player { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  iframe { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 0; border-radius: 10px; }
  .now h2 { font-size: 20px; margin: 12px 0 4px; }
  .now .meta { color: var(--text-2); font-size: 13px; }
  .now a { color: var(--gold); }
  ol.list { list-style: none; margin: 0; padding: 0; max-height: 72vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
  ol.list li { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  ol.list li:last-child { border-bottom: 0; }
  ol.list li.grp { display: block; cursor: default; padding: 8px 12px; font-size: 12px; letter-spacing: .08em; color: var(--gold); background: var(--panel); }
  ol.list li:hover { background: var(--panel); }
  ol.list li[aria-current] { background: rgba(240, 185, 11, .12); }
  ol.list .ep { font-family: Menlo, monospace; color: var(--gold); font-size: 13px; padding-top: 2px; }
  ol.list .t { font-size: 14px; }
  ol.list .d { color: var(--text-2); font-size: 12px; }
  @media (max-width: 860px) { .player { grid-template-columns: minmax(0, 1fr); } ol.list { max-height: none; } }
</style>
</head>
<body>
<div class="page">
  <h1>交易所系统讲解幻灯片</h1>
  <p class="lead">以币安为例，讲清中心化交易所的系统组成与底层逻辑。主线 17 集、幕后核心 12 集、产品深潜 11 集。每集是一个可翻页的动画讲解页，右侧选集，点「新窗口打开」可全屏观看。</p>
  <div class="player">
    <div>
      <iframe id="v" title="slide"></iframe>
      <div class="now">
        <h2 id="title"></h2>
        <div class="meta" id="meta"></div>
      </div>
    </div>
    <ol class="list" id="list"></ol>
  </div>
</div>
<script>
const EPISODES = [
  ['EP01', 'what-is-cex', '交易所到底是什么：托管、记账、撮合'],
  ['EP02', 'architecture-map', '一张图看懂交易所架构'],
  ['EP03', 'order-journey', '一笔订单的旅程：调用链、同步异步与故障'],
  ['EP04', 'account-identity', '账户与身份：登录、2FA、API 签名、KYC'],
  ['EP05', 'deposit-confirmations', '充值：地址、确认数与链重组'],
  ['EP06', 'withdrawal-wallets-por', '提币、冷热钱包与储备金证明'],
  ['EP07', 'ledger-double-entry', '账本：双分录与冻结'],
  ['EP08', 'ledger-reliability', '账本可靠性：幂等、对账与热点账户'],
  ['EP09', 'order-book-rules', '订单簿与撮合规则'],
  ['EP10', 'matching-engine-internals', '撮合引擎内部：数据结构、定序与重放'],
  ['EP11', 'clearing-fees', '成交之后：清算、结算与手续费'],
  ['EP12', 'market-data', '行情：深度、K 线与增量同步'],
  ['EP13', 'risk-control', '风控：交易前、交易中与限流'],
  ['EP14', 'perpetual-funding-mark', '永续合约：资金费率与标记价格'],
  ['EP15', 'margin-liquidation', '保证金与强平：保险基金和 ADL'],
  ['EP16', 'business-model', '交易所怎么赚钱：产品生态与商业模式'],
  ['EP17', 'reliability-incidents', '交易所怎样倒下：可靠性与事故复盘'],
  ['B01', 'compliance', '合规防护：KYC、反洗钱与 Travel Rule'],
  ['B02', 'platform-security', '平台安全：密钥、内控与供应链'],
  ['B03', 'account-security', '账户安全：盗号攻击链与逐层防御'],
  ['B04', 'reconciliation', '系统对账：全链路对账与提币熔断'],
  ['B05', 'business-risk', '业务风控：薅羊毛、市场操纵与信用风险'],
  ['B06', 'treasury-liquidity', '金库与流动性：储备、调拨与挤兑压力'],
  ['B07', 'incident-response', '应急响应：事故分级、止血与追回'],
  ['B08', 'risk-platform', '实时风控平台：特征、规则、模型与灰度'],
  ['B09', 'global-licensing', '全球监管与牌照：一家交易所怎样分区经营'],
  ['B10', 'tax-privacy', '税务报送与数据隐私：交易所也是信息报送人'],
  ['B11', 'security-engineering', '安全工程：把安全做进研发与运营'],
  ['B12', 'incident-casebook', '安全事故案例库：防线是怎样被突破的'],
  ['P01', 'margin-and-loans', '杠杆与借贷：钱从哪来，利率怎么定'],
  ['P02', 'convert-otc', '闪兑与 OTC：平台报价背后的风险'],
  ['P03', 'p2p-fiat', 'P2P 与法币通道：担保交易和反诈'],
  ['P04', 'advanced-derivatives', '合约进阶：统一账户、组合保证金与期权'],
  ['P05', 'earn-savings-staking', '存币生息：活期、定期与流动性质押'],
  ['P06', 'structured-products', '双币投资：高收益背后的期权'],
  ['P07', 'listing-launch', '上币与新币分发：Launchpad、Launchpool 与空投'],
  ['P08', 'strategy-copy-trading', '策略交易与跟单：网格、定投与带单分润'],
  ['P09', 'pay-and-card', '支付与卡：Binance Pay、礼品卡与加密借记卡'],
  ['P10', 'web3-wallet', 'Web3 钱包：MPC、DEX 聚合与授权风险'],
  ['P11', 'growth-institutional', '增长与机构：推荐返佣、VIP、经纪商与做市商'],
];
const v = document.getElementById('v'), list = document.getElementById('list');
const GROUP = { E: '主线', B: '下篇一 · 幕后核心', P: '下篇二 · 产品深潜' };
list.innerHTML = EPISODES.map(([ep, slug, t], i) => (i === 0 || EPISODES[i - 1][0][0] !== ep[0] ? `<li class="grp">${GROUP[ep[0]]}</li>` : '') + `<li data-i="${i}"><span class="ep">${ep}</span><span><span class="t">${t}</span><br><span class="d" id="d${i}"></span></span></li>`).join('');
function play(i) {
  const [ep, slug, t] = EPISODES[i], base = ep + '-' + slug;
  v.src = base + '.html';
  document.getElementById('title').textContent = ep + ' ' + t;
  document.getElementById('meta').innerHTML = `<a href="${base}.html" target="_blank" rel="noopener">新窗口打开</a>`;
  list.querySelectorAll('li[data-i]').forEach(li => li.toggleAttribute('aria-current', +li.dataset.i === i));
  try { localStorage.setItem('cex-ep-id', EPISODES[i][0]); } catch (e) {}
}
list.addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if (li) play(+li.dataset.i); });
let start = 0;
try { start = Math.max(0, EPISODES.findIndex(e => e[0] === localStorage.getItem('cex-ep-id'))); } catch (e) {}
play(Math.min(start, EPISODES.length - 1));
</script>
</body>
</html>
